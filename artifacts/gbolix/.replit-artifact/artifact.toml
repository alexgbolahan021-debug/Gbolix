kind = "web"
previewPath = "/"
title = "Gbolix"
version = "1.0.0"
id = "artifacts/gbolix"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18371

[services.development]
run = "pnpm --filter @workspace/gbolix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gbolix", "run", "build" ]
publicDir = "artifacts/gbolix/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18371"
BASE_PATH = "/"
