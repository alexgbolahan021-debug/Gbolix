    MoneyTotal:
      type: object
      properties:
        currency:
          type: string
        amount:
          type: number
      required: [currency, amount]

    ProjectValueSlice:
      type: object
      properties:
        status:
          type: string
        currency:
          type: string
        amount:
          type: number
      required: [status, currency, amount]

    PaymentValueSlice:
      type: object
      properties:
        name:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/MoneyTotal"
      required: [name, values]

    TrendPoint:
      type: object
      properties:
        date:
          type: string
        value:
          type: number
        currency:
          type: string
      required: [date, value]

    WalletMetrics:
      type: object
      properties:
        totalPurchases:
          type: integer
        purchaseValue:
          type: array
          items:
            $ref: "#/components/schemas/MoneyTotal"
        creditsPurchased:
          type: integer
        outstandingCredits:
          type: integer
        creditsUsed:
          type: integer
        purchasingCustomers:
          type: integer
        averagePurchaseValue:
          type: array
          items:
            $ref: "#/components/schemas/MoneyTotal"
      required: [totalPurchases, purchaseValue, creditsPurchased, outstandingCredits, creditsUsed, purchasingCustomers, averagePurchaseValue]

    PieSlice:
      type: object
      properties:
        name:
          type: string
        value:
          type: integer
      required:
        - name
        - value
