openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gbolix API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: projects
    description: Service request / project operations
  - name: files
    description: File operations
  - name: messages
    description: Project messaging
  - name: notifications
    description: Notification operations
  - name: admin
    description: Admin portal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── User / profile ───────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/onboarding:
    post:
      operationId: completeOnboarding
      tags: [users]
      summary: Complete onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/dashboard-summary:
    get:
      operationId: getDashboardSummary
      tags: [users]
      summary: Get client dashboard summary counts
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /users/me/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [users]
      summary: Get recent activity feed for current user
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /users/me/unread-count:
    get:
      operationId: getUnreadCount
      tags: [users]
      summary: Get unread message count across all projects
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  # ── Projects (service requests) ──────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List current user's projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project (service request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project (client)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  # ── Files ─────────────────────────────────────────────────────────────────────
  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List current user's files
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileRecord"

  /files/upload:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a file (base64 JSON body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "201":
          description: Uploaded file record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"

  /files/download/{filename}:
    get:
      operationId: downloadFile
      tags: [files]
      summary: Download a file by stored filename
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File binary

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Messages ──────────────────────────────────────────────────────────────────
  /projects/{projectId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /projects/{projectId}/messages/read:
    post:
      operationId: markMessagesRead
      tags: [messages]
      summary: Mark all messages in a project as read
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required:
                  - updated

  # ── Notifications ─────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationItem"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required:
                  - updated

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  # ── Admin ─────────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: userType
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get detailed user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"

  /admin/users/{id}/role:
    patch:
      operationId: adminChangeUserRole
      tags: [admin]
      summary: Change a user's role (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/deactivate:
    post:
      operationId: adminDeactivateUser
      tags: [admin]
      summary: Deactivate or reactivate a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
              required:
                - isActive
      responses:
        "200":
          description: Updated

  /admin/team:
    get:
      operationId: adminListTeam
      tags: [admin]
      summary: List all staff (owner, admin, specialist)
      responses:
        "200":
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /admin/projects:
    get:
      operationId: adminListProjects
      tags: [admin]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProject"

  /admin/projects/{id}:
    patch:
      operationId: adminUpdateProject
      tags: [admin]
      summary: Update a project (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProject"

  /admin/projects/{id}/start-conversation:
    post:
      operationId: adminStartConversation
      tags: [admin]
      summary: Start a conversation on a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProject"

  /admin/projects/{id}/assign:
    post:
      operationId: adminAssignFreelancer
      tags: [admin]
      summary: Assign or unassign freelancers to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignFreelancerInput"
      responses:
        "200":
          description: Updated assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId:
                    type: integer
                  freelancerIds:
                    type: array
                    items:
                      type: integer
                required:
                  - projectId
                  - freelancerIds

  /admin/insights:
    get:
      operationId: adminGetInsights
      tags: [admin]
      summary: Get aggregated analytics/insights
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d, 12m, all]
            default: all
      responses:
        "200":
          description: Insights data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insights"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
      required:
        - status
        - timestamp

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        userType:
          type: ["string", "null"]
        companySize:
          type: ["string", "null"]
        acquisitionSource:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        onboardingCompleted:
          type: boolean
        role:
          type: string
          enum: [owner, admin, specialist, client]
        isActive:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        lastLoginAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - name
        - email
        - onboardingCompleted
        - role
        - isActive
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
        companyName:
          type: string
        phone:
          type: string
        website:
          type: string
        country:
          type: string
        city:
          type: string
        timezone:
          type: string
        language:
          type: string
        avatarUrl:
          type: string

    OnboardingInput:
      type: object
      properties:
        userType:
          type: string
        location:
          type: string
        companySize:
          type: string
        acquisitionSource:
          type: string
      required:
        - userType
        - location
        - companySize
        - acquisitionSource

    DashboardSummary:
      type: object
      properties:
        activeTasks:
          type: integer
        queuedTasks:
          type: integer
        completedTasks:
          type: integer
        openTickets:
          type: integer
        filesUploaded:
          type: integer
        servicesOrdered:
          type: integer
        unreadMessages:
          type: integer
      required:
        - activeTasks
        - queuedTasks
        - completedTasks
        - openTickets
        - filesUploaded
        - servicesOrdered
        - unreadMessages

    UnreadCount:
      type: object
      properties:
        unread:
          type: integer
      required:
        - unread

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [request_submitted, admin_response, file_uploaded, status_change]
        description:
          type: string
        createdAt:
          type: string
        projectId:
          type: ["integer", "null"]
        projectTitle:
          type: ["string", "null"]
      required:
        - id
        - type
        - description
        - createdAt

    Project:
      type: object
      properties:
        id:
          type: integer
        projectCode:
          type: string
        userId:
          type: integer
        serviceType:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [submitted, queued, pending_review, needs_info, approved, declined, agreement_sent, agreement_accepted, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        price:
          type: ["number", "null"]
        hasConversation:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectCode
        - userId
        - serviceType
        - title
        - description
        - status
        - priority
        - hasConversation
        - createdAt
        - updatedAt

    ProjectInput:
      type: object
      properties:
        serviceType:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        price:
          type: number
      required:
        - serviceType
        - title
        - description
        - priority

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string

    FileRecord:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        projectId:
          type: ["integer", "null"]
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        url:
          type: string
        createdAt:
          type: string
      required:
        - id
        - userId
        - filename
        - originalName
        - mimeType
        - size
        - url
        - createdAt

    FileUploadInput:
      type: object
      properties:
        filename:
          type: string
        mimeType:
          type: string
        data:
          type: string
        projectId:
          type: integer
      required:
        - filename
        - mimeType
        - data

    Message:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        senderId:
          type: integer
        senderName:
          type: string
        senderRole:
          type: string
          enum: [owner, admin, specialist, client]
        content:
          type: string
        fileUrl:
          type: ["string", "null"]
        fileName:
          type: ["string", "null"]
        fileMimeType:
          type: ["string", "null"]
        isRead:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - projectId
        - senderId
        - senderName
        - senderRole
        - content
        - isRead
        - createdAt

    MessageInput:
      type: object
      properties:
        content:
          type: string
        fileData:
          type: string
        fileName:
          type: string
        fileMimeType:
          type: string

    NotificationItem:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        projectId:
          type: ["integer", "null"]
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [new_message, status_change, file_uploaded, new_project, admin_reply]
        isRead:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - userId
        - title
        - message
        - type
        - isRead
        - createdAt

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        userType:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        companySize:
          type: ["string", "null"]
        acquisitionSource:
          type: ["string", "null"]
        registrationDate:
          type: string
        totalRequests:
          type: integer
        role:
          type: string
          enum: [owner, admin, specialist, client]
        isActive:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        lastLoginAt:
          type: ["string", "null"]
      required:
        - id
        - name
        - email
        - registrationDate
        - totalRequests
        - role
        - isActive

    AdminUserDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        userType:
          type: ["string", "null"]
        companySize:
          type: ["string", "null"]
        acquisitionSource:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        timezone:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, admin, specialist, client]
        isActive:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]
        totalProjects:
          type: integer
        completedProjects:
          type: integer
        totalFiles:
          type: integer
        totalMessages:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - id
        - name
        - email
        - role
        - isActive
        - createdAt
        - totalProjects
        - completedProjects
        - totalFiles
        - totalMessages
        - recentActivity

    RoleChangeInput:
      type: object
      properties:
        role:
          type: string
          enum: [owner, admin, specialist, client]
      required:
        - role

    TeamMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, specialist]
        isActive:
          type: boolean
        avatarUrl:
          type: ["string", "null"]
        assignedProjects:
          type: integer
        createdAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]
      required:
        - id
        - name
        - email
        - role
        - isActive
        - assignedProjects
        - createdAt

    AssignFreelancerInput:
      type: object
      properties:
        freelancerIds:
          type: array
          items:
            type: integer
      required:
        - freelancerIds

    AdminProject:
      type: object
      properties:
        id:
          type: integer
        projectCode:
          type: string
        title:
          type: string
        serviceType:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [submitted, queued, pending_review, needs_info, approved, declined, agreement_sent, agreement_accepted, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        price:
          type: ["number", "null"]
        internalNotes:
          type: ["string", "null"]
        hasConversation:
          type: boolean
        clientName:
          type: string
        clientEmail:
          type: string
        assignedFreelancers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
            required:
              - id
              - name
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - projectCode
        - title
        - serviceType
        - description
        - status
        - priority
        - hasConversation
        - clientName
        - clientEmail
        - assignedFreelancers
        - createdAt
        - updatedAt

    AdminProjectUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [submitted, queued, pending_review, needs_info, approved, declined, cancelled, agreement_sent, agreement_accepted, in_progress, review, completed]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        internalNotes:
          type: string
        price:
          type: number
        reason:
          type: string
          description: Reason recorded when an admin changes the project status.

    Insights:
      type: object
      properties:
        range:
